aid: easel
name: Easel AI
description: Easel AI is a Los Angeles based generative AI company building a consumer
  app and a partner-facing image generation platform. Its models turn a single selfie
  into photorealistic single and multiplayer avatars without any per-user AI training,
  and the same technology is packaged for commercial use as Fashion Photoshoot (AI
  models of any race or body type wearing any outfit), Fashion Try-On (shoppers upload
  a picture and see themselves in an outfit instantly), Ad Creator (personalized ad
  creative from one selfie plus a context image), and Product Photoshoot (products
  placed in any scenario). Easel ships a consumer iOS app and markets a Try-On API
  and ad-generation API to fashion brands, ad platforms, messaging apps, dating and
  social apps, and talent agencies monetizing digital IP. As of this pass the API
  surface is partner-gated and contact-sales only - there is no public developer portal,
  documentation, API reference, machine-readable specification, or self-serve signup
  published on the website. Easel appears on the a16z investment list.
